########################################################################
# plr.cfg - Power Loss Recovery for Ender 3 V3 SE / Klipper / Fluidd
#
# Install:  ~/printer_data/config/plr/
# Include:  [include plr/plr.cfg]   in printer.cfg
#
# Requires: gcode_shell_command (you already have it), python3,
#           [virtual_sdcard], [force_move] enable_force_move: True
########################################################################

# SET_KINEMATIC_POSITION is gated behind this section.  It is what lets
# us tell Klipper "the nozzle is physically at Z=x" after a restart,
# instead of probing down onto the half-finished print.
[force_move]
enable_force_move: True


########################################################################
# Shell commands
########################################################################

[gcode_shell_command plr_log]
command: /bin/sh __PLR_DIR__/plr_log.sh
timeout: 15.
verbose: False

[gcode_shell_command plr_clear]
command: /bin/sh __PLR_DIR__/plr_clear.sh
timeout: 15.
verbose: False

[gcode_shell_command plr_build]
command: __PYTHON__ __PLR_DIR__/plr_build.py
timeout: 900.
verbose: True

[gcode_shell_command plr_abort]
command: /bin/sh __PLR_DIR__/plr_abort.sh
timeout: 15.
verbose: True

[gcode_shell_command plr_check]
command: /bin/sh __PLR_DIR__/plr_check.sh
timeout: 15.
verbose: True


########################################################################
# Macros
########################################################################

[gcode_macro PLR_BEGIN]
description: PLR - arm recovery tracking (call at the end of PRINT_START)
gcode:
    RUN_SHELL_COMMAND CMD=plr_clear
    SET_GCODE_VARIABLE MACRO=PLR_LOG VARIABLE=enabled VALUE=1


[gcode_macro PLR_FINISH]
description: PLR - disarm recovery tracking (call at the start of PRINT_END)
gcode:
    SET_GCODE_VARIABLE MACRO=PLR_LOG VARIABLE=enabled VALUE=0
    RUN_SHELL_COMMAND CMD=plr_clear


[gcode_macro PLR_LOG]
description: PLR - record the resume point (call once per layer change)
variable_enabled: 1
gcode:
    {% set self = printer["gcode_macro PLR_LOG"] %}
    {% if self.enabled|int == 1 and printer.virtual_sdcard.is_active %}
        {% set gm   = printer.gcode_move %}
        {% set th   = printer.toolhead %}
        {% set mesh = printer.bed_mesh.profile_name|default("") %}
        # NOTE: the rendered RUN_SHELL_COMMAND must be ONE line. Klipper treats
        # every line a macro renders as a separate G-code command, so a PARAMS
        # string wrapped across lines produces an unterminated quote and a
        # "Malformed command" error. Build the arg string first, emit it once.
        {% set a = "'" ~ printer.virtual_sdcard.file_path ~ "' " ~ printer.virtual_sdcard.file_position ~ " " ~ gm.gcode_position.x ~ " " ~ gm.gcode_position.y ~ " " ~ gm.gcode_position.z ~ " " ~ th.position.z ~ " " ~ gm.homing_origin.z ~ " " ~ printer.fan.speed ~ " " ~ gm.speed_factor ~ " " ~ gm.extrude_factor ~ " " ~ printer.extruder.target ~ " " ~ printer.heater_bed.target ~ " '" ~ mesh ~ "'" %}
        RUN_SHELL_COMMAND CMD=plr_log PARAMS="{a}"
    {% endif %}


[gcode_macro PLR_STATUS]
description: PLR - show the stored recovery point
gcode:
    RUN_SHELL_COMMAND CMD=plr_check


[gcode_macro PLR_PREPARE]
description: PLR - build the <name>.plr.gcode resume file
gcode:
    {% set lift    = params.LIFT|default(5)|float %}
    {% set retract = params.RETRACT|default(2.0)|float %}
    {% set prime   = params.PRIME|default(0.6)|float %}
    {% set purge   = params.PURGE|default(0)|float %}
    {% set a = "--lift " ~ lift ~ " --retract " ~ retract ~ " --prime " ~ prime ~ " --purge " ~ purge %}
    RESPOND TYPE=echo MSG="PLR: building resume file, this can take a minute..."
    RUN_SHELL_COMMAND CMD=plr_build PARAMS="{a}"
    RESPOND TYPE=echo MSG="PLR: done. Refresh the job list and start the *.plr.gcode file."


[gcode_macro PLR_RESUME]
description: PLR - build the resume file AND start printing it
gcode:
    {% set lift    = params.LIFT|default(5)|float %}
    {% set retract = params.RETRACT|default(2.0)|float %}
    {% set prime   = params.PRIME|default(0.6)|float %}
    {% set purge   = params.PURGE|default(0)|float %}
    {% set delay   = params.DELAY|default(20)|float %}
    {% set a = "--lift " ~ lift ~ " --retract " ~ retract ~ " --prime " ~ prime ~ " --purge " ~ purge ~ " --start --start-delay " ~ delay %}
    RESPOND TYPE=echo MSG="PLR: building resume file..."
    RUN_SHELL_COMMAND CMD=plr_build PARAMS="{a}"


[gcode_macro PLR_CANCEL_START]
description: PLR - cancel a pending auto-start before it fires
gcode:
    RUN_SHELL_COMMAND CMD=plr_abort


[gcode_macro PLR_DISCARD]
description: PLR - forget the stored recovery point
gcode:
    RUN_SHELL_COMMAND CMD=plr_clear
    RESPOND TYPE=echo MSG="PLR: recovery point discarded."


# Fires ~10 s after every Klipper start.  If a recovery point survived,
# it prints a notice into the Fluidd console.
[delayed_gcode PLR_STARTUP_CHECK]
initial_duration: 10
gcode:
    RUN_SHELL_COMMAND CMD=plr_check
